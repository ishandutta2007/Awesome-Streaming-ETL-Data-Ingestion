<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="flowGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes streamFlow{0%{stroke-dashoffset:1000}}@keyframes pulse{0%{transform:scale(.98);opacity:.7}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:46px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.stream-line{stroke:url(#flowGrad);stroke-width:3;fill:none;stroke-dasharray:12 8;animation:streamFlow 20s linear infinite}.pulse-node{animation:pulse 3s ease-in-out infinite alternate}</style><rect width="1200" height="300" fill="url(#bgGrad)" rx="16"/><g opacity=".35"><path d="M -50 60 Q 300 120, 600 50 T 1250 80" class="stream-line"/><path d="M -50 240 Q 400 180, 700 250 T 1250 220" class="stream-line" style="animation-duration:15s;stroke-width:2"/><path d="M -50 150 Q 200 280, 800 120 T 1250 170" class="stream-line" style="animation-duration:25s;stroke-width:4"/></g><g class="pulse-node" opacity=".85" transform="translate(920, 70)"><rect widt